<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find Healthcare</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="facilities-header">
    <h1>Find Healthcare Near You</h1>

    <p>
        Discover healthcare facilities and services available in your area.
    </p>
    </div>
    <div id="facilitiesContainer">
        <p>Loading healthcare facilities...</p>
    </div>


    <script>

        fetch("https://ruralhealthhub-production.up.railway.app/api/facilities")
            .then(response => response.json())
            .then(facilities => {

                const container = document.getElementById("facilitiesContainer");

                container.innerHTML = "";

                facilities.forEach(facility => {

                    const services = facility.services.split(",");

                    let servicesList = "";

                    services.forEach(service => {
                        servicesList += `<span class="service-item">${service.trim()}</span>`;
                    });

                    container.innerHTML += `
                        <div class="facility-card">
                            <h2>${facility.name}</h2>

                            <p>📍 ${facility.location}</p>

                            <p>Services:</p>

                            <ul>
                                ${servicesList}
                            </ul>

                            <button onclick="window.location.href='facility-details.html?id=${facility.id}'">
                                View Services
                            </button>
                        </div>
                    `;

                });

            })
            .catch(error => {

                console.error("Error:", error);

                document.getElementById("facilitiesContainer").innerHTML =
                    "<p>Unable to load healthcare facilities.</p>";

            });

    </script>

</body>

</html>
