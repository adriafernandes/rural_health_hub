<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facility Details | Rural Health Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🏥 Rural Health Hub
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="facilities.html">Find Healthcare</a>
        </div>

    </nav>


    <section class="facility-details">

        <p class="section-label">
            HEALTHCARE FACILITY
        </p>

        <h1 id="facilityName">Loading...</h1>

        <p class="location" id="facilityLocation">
            📍 Loading...
        </p>

        <p id="facilityDescription">
            Loading facility information...
        </p>


        <h2>Available Services</h2>

        <div class="available-services" id="servicesContainer">
            Loading services...
        </div>


        <div class="facility-info">

            <p>
                <strong>Opening Hours:</strong>
                <span id="openingHours">Loading...</span>
            </p>

            <p>
                <strong>Status:</strong>
                <span id="facilityStatus">Loading...</span>
            </p>

            <p>
                <strong>Contact:</strong>
                <span id="facilityContact">Loading...</span>
            </p>

        </div>


        <button
            class="primary-btn"
            id="consultationButton">

            Request Consultation →

        </button>

    </section>


    <script src="script.js"></script>

    <script>

        // Get facility ID from the URL

        const urlParams = new URLSearchParams(window.location.search);
        const facilityId = urlParams.get("id");


        // Get facility information from Flask

        fetch(`https://ruralhealthhub-production.up.railway.app/api/facilities/${facilityId}`)

            .then(response => response.json())

            .then(facility => {

                document.getElementById("facilityName").textContent =
                    facility.name;

                document.getElementById("facilityLocation").textContent =
                    "📍 " + facility.location;

                document.getElementById("facilityDescription").textContent =
                    facility.description;

                document.getElementById("openingHours").textContent =
                    facility.opening_hours;

                document.getElementById("facilityStatus").textContent =
                    facility.status;

                document.getElementById("facilityContact").textContent =
                    facility.contact;


                const servicesContainer =
                    document.getElementById("servicesContainer");

                servicesContainer.innerHTML = "";


                const services = facility.services.split(",");


                services.forEach(service => {

                    servicesContainer.innerHTML += `
                        <div class="available-service">
                            🩺
                            <h3>${service.trim()}</h3>
                            <p>Healthcare service available at this facility.</p>
                        </div>
                    `;

                });

            })

            .catch(error => {

                console.error("Error:", error);

                document.getElementById("facilityName").textContent =
                    "Unable to load facility";

            });

    </script>

</body>

</html>
